<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="cloud.js"></script>
<title>Canyon Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Gaegu:wght@700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D world; HUD top-left, minimap top-right, action pad bottom-right, dialogue sheet bottom */
:root{
  --ink:#3a2c44; --ink-soft:#5b4a62; --paper:#fff6e9; --paper-2:#fffaf2; --edge:#efd9bf; --sunset:#e8833a; --teal:#3aa6a0; --gold:#f2c14e; --rose:#e0607a; --night:#2b2752;
  --display:'Caprasimo','Cooper Black',Georgia,serif; --hand:'Gaegu','Comic Sans MS',cursive; --ui:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;touch-action:none;overscroll-behavior:none;}
.sheet,#results,#results *{touch-action:pan-y;}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#stage{position:fixed;inset:0;touch-action:none;}
#stage canvas{display:block;width:100%;height:100%;}
button{font:800 14px/1 var(--ui);color:var(--paper);background:var(--ink);border:0;border-radius:999px;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 #c8581f;touch-action:manipulation;}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
button:disabled{opacity:.45;cursor:default;}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(260px,calc(100vw - 170px));}
.bars{background:rgba(32,28,64,.72);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;}
.barrow{display:flex;align-items:center;gap:7px;font:900 10px/1 var(--ui);letter-spacing:.06em;}
.bar{position:relative;flex:1;height:9px;border-radius:5px;background:rgba(255,246,233,.18);overflow:hidden;min-width:90px;}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;transition:width .15s;}
#hpBar i{background:linear-gradient(90deg,#7fd1a0,#4fb07e);}
#hpBar.low i{background:var(--rose);}
#stBar i{background:var(--gold);}
.meta{display:flex;gap:6px;flex-wrap:wrap;font:800 11px/1 var(--ui);}
#menuBtn{display:none}
@media (max-width:560px){ .meta .opt{display:none} .meta{font-size:10px;gap:4px} .chip{padding:4px 7px} .obj{font-size:11.5px;padding:6px 9px;max-width:58vw} .bar{height:7px;min-width:70px}
  #mini{width:84px!important;height:98px!important} #menuBtn{display:block;align-self:flex-end;width:40px;height:40px;padding:0;font-size:18px;border-radius:12px} #side>button:not(#menuBtn){display:none} #side.open>button:not(#menuBtn):not([hidden]){display:block} #side{top:calc(env(safe-area-inset-top,0px) + 116px)!important} #side.camp{top:calc(env(safe-area-inset-top,0px) + 12px)!important} }
.chip{background:rgba(32,28,64,.72);padding:6px 9px;border-radius:999px;}
.obj{background:var(--paper);color:var(--ink);font:800 12.5px/1.3 var(--ui);padding:8px 11px;border-radius:12px;box-shadow:0 4px 12px rgba(20,10,40,.3);}
#mini{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(14px,env(safe-area-inset-right,0px));width:118px;height:138px;border-radius:14px;background:rgba(32,28,64,.72);box-shadow:0 4px 12px rgba(20,10,40,.3);}
#zoneToast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 29vh);transform:translate(-50%,-10px);font:400 clamp(26px,6vw,38px)/1 var(--display);color:var(--paper);text-shadow:0 3px 0 rgba(20,10,40,.4),0 0 24px rgba(20,10,40,.4);opacity:0;transition:opacity .5s,transform .5s;pointer-events:none;text-align:center;white-space:nowrap;}
#zoneToast small{display:block;font:800 11px/1.4 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);}
#zoneToast.on{opacity:1;transform:translate(-50%,0);}
#callout{position:fixed;left:12px;right:12px;margin:0 auto;max-width:440px;bottom:calc(env(safe-area-inset-bottom,0px) + 164px);display:flex;align-items:flex-start;gap:8px;background:rgba(32,28,64,.8);border:1.5px solid rgba(58,166,160,.8);color:#e9fffb;font:800 13px/1.32 var(--ui);padding:7px 12px 7px 9px;border-radius:12px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none;text-align:left;}
#callout.on{opacity:1;transform:none}
#callout>svg{flex:none;width:22px;height:13px;margin-top:2px;}
#bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);font:700 19px/1.1 var(--hand);padding:6px 13px;border-radius:14px;box-shadow:0 6px 16px rgba(20,10,40,.3);white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;}
#bubble.on{opacity:1}
#pad{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto;gap:12px;align-items:end;}
#actBtn{grid-column:3;grid-row:1/3;width:92px;height:92px;padding:0;border-radius:50%;font-size:14px;line-height:1.1;}
#actBtn.ctx{background:var(--sunset);box-shadow:0 4px 0 #a8501c;}
#jumpBtn{grid-column:1;grid-row:2;align-self:end;width:62px;height:62px;padding:0;border-radius:50%;background:#7a6ac9;box-shadow:0 4px 0 #4f4590;justify-self:center;font-size:13px;}
#rollBtn{grid-column:2;grid-row:2;width:64px;height:64px;padding:0;border-radius:50%;background:var(--teal);box-shadow:0 4px 0 #24706b;}
#coffeeBtn{grid-column:2;grid-row:1;width:58px;height:58px;padding:0;border-radius:50%;background:#a8714c;box-shadow:0 4px 0 #6e4530;font-size:11px;line-height:1.1;justify-self:end;}
#joy{position:fixed;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:3px solid rgba(255,246,233,.55);pointer-events:none;display:none;}
#knob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:rgba(255,246,233,.75);}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);background:rgba(43,39,82,.65);font:800 11px/1.3 var(--ui);padding:7px 12px;border-radius:999px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
@media (pointer:coarse){#hint{display:none}}
.sheet{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(560px,calc(100vw - 28px));max-height:min(70vh,560px);overflow:auto;background:var(--paper);color:var(--ink);border-radius:8px 18px 14px 18px;padding:18px 18px 16px;box-shadow:0 2px 0 var(--edge),0 24px 50px rgba(20,10,40,.45);display:flex;flex-direction:column;gap:10px;z-index:5;}
.sheet .who{display:flex;align-items:center;gap:10px;}
.sheet .face{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font:400 20px/1 var(--display);color:#fff;}
.sheet .name{font:400 20px/1 var(--display);}
.sheet .role{font:800 10px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#a0573a;}
.sheet p.line{margin:0;font:700 20px/1.25 var(--hand);color:var(--ink);}
.sheet .opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;}
.sheet .opts button.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);}
.sheet .opts button.gold{background:var(--sunset);box-shadow:0 4px 0 #a8501c;}
.list{display:flex;flex-direction:column;gap:8px;}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--paper-2);border:2px solid var(--edge);}
.li b{font:800 14px/1.2 var(--ui);}
.li span{grid-column:1;font:700 12px/1.35 var(--ui);color:var(--ink-soft);}
.li button{grid-row:1/3;grid-column:2;padding:9px 13px;font-size:12px;}
.need{display:inline-block;margin-right:6px;}
.need.short{color:#c8506e;}
.page{font:700 19px/1.35 var(--hand);color:#5a3a28;background:#f6e7c8;border-radius:6px;padding:14px 16px;box-shadow:inset 0 0 0 1px #e2c99b;}
#results{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,14,40,.6);z-index:6;}
#results .card{width:min(460px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:8px 18px 14px 18px;padding:24px 22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px rgba(20,10,40,.5);}
#results h2{margin:0;font:400 clamp(28px,7vw,36px)/1 var(--display);}
.eyebrow{margin:0;font:800 11px/1.2 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:#a0573a;}
.loot{display:flex;flex-wrap:wrap;gap:6px;}
.loot span{font:800 12px/1 var(--ui);padding:7px 10px;border-radius:999px;background:#f3e3cf;color:#6d4f5c;}
.loot span.rare{background:#fbe7b4;color:#7a4d10;}
#decoBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(620px,calc(100vw - 28px));background:var(--paper);color:var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 40px rgba(20,10,40,.45);z-index:4;}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.dhead b{display:block;font:400 22px/1 var(--display);}
.dhead span{display:block;margin-top:3px;font:700 11.5px/1.2 var(--ui);color:var(--ink-soft);}
.dtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
.dtabs button{flex:none;position:relative;background:var(--paper-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge);padding:8px 12px;font-size:12.5px;}
.dtabs button.on{background:var(--ink);color:var(--paper);box-shadow:none;}
.dtabs button i{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--rose);}
.dmsg{margin:0;padding:8px 10px;border-radius:10px;background:#2b2752;color:#fff6e9;font:800 12.5px/1.35 var(--ui);}
#dressBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);width:min(620px,calc(100vw - 24px));max-height:46vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 40px rgba(20,10,40,.35);z-index:6;touch-action:pan-y;}
#dressBar>*{flex-shrink:0;}
.boot{background:#1e2a24;color:#9ff0c0;border-radius:10px;padding:14px;font:700 14px/1.5 ui-monospace,Menlo,monospace}.boot p{margin:0 0 8px}.boot small{opacity:.75;font-weight:500}.bbar{height:12px;border-radius:6px;background:#2f4038;overflow:hidden;margin-bottom:10px}.bbar i{display:block;height:100%;width:0;background:#7fe0b0;transition:width .25s}
.pols{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px 12px;padding:4px 2px 6px}
.pol{background:#fffaf0;border:0;border-radius:3px;padding:7px 7px 6px;box-shadow:0 3px 10px rgba(40,20,40,.22);transform:rotate(var(--r));display:flex;flex-direction:column;gap:6px;cursor:pointer;font:800 11.5px/1.2 var(--ui);color:#3a2c44;text-align:center}
.pol img,.pol .q{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:1px}
.pol .q{background:#6d5a74;color:#fff6e9;font:700 30px/1 var(--story,serif);display:grid;place-items:center}
.pol.locked{opacity:.75}.pol.locked span{color:#8a6f7c}
#photoView{position:fixed;inset:0;z-index:60;background:rgba(24,16,30,.86);display:grid;place-items:center;padding:16px}
#photoView .pv{width:min(760px,100%);background:#fffaf0;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#photoView .pvimg{overflow:hidden;border-radius:2px;aspect-ratio:4/3}
#photoView .pvimg img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:30% 50%}
#photoView.go .pvimg img{animation:kb 9s ease-in-out}
@keyframes kb{0%{transform:scale(1) translate(0,0)}50%{transform:scale(1.35) translate(-9%,3%)}100%{transform:scale(1) translate(0,0)}}
#photoView .pvtxt{display:flex;flex-direction:column;gap:4px;color:#3a2c44}
#photoView small{font:900 10px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:#8a6f7c}
#photoView b{font:600 22px/1.2 var(--story,serif)}#photoView p{margin:0;font:500 15px/1.45 var(--story,serif)}
#photoView .pvb{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
@media (min-width:760px) and (min-height:500px){#photoView .pv{flex-direction:row;align-items:center}#photoView .pvimg{flex:1.5}#photoView .pvtxt{flex:1}}
#dressBar .adet{background:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font:700 13px/1.35 var(--ui)}#dressBar .adet>b{font:600 18px/1.2 var(--story,serif)}#dressBar .adet button{align-self:flex-start}#dressBar .adet .statrow{display:flex;align-items:center;gap:8px;font:900 11px/1 var(--ui);color:#6d4f5c}#dressBar .adet .cost{font:700 12px/1.4 var(--ui);color:#5b4a62}
body.dress #side,body.dress #obj,body.dress #callout,body.dress #mini,body.dress #meta,body.dress #joy{opacity:0!important;pointer-events:none!important;}
#decoBar .tray{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
#decoBar .tray button{flex:none;background:var(--paper-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge);padding:10px 12px;font-size:12px;}
#decoBar .tray button.on{box-shadow:inset 0 0 0 3px var(--sunset);}
#decoBar .row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;}
#decoBar p{margin:0;font:700 12.5px/1.35 var(--ui);color:var(--ink-soft);}
.notes{display:flex;flex-direction:column;gap:6px;}
.note{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:9px 11px;border-radius:10px;background:var(--paper-2);border:2px solid var(--edge);}
.note b{display:block;font:800 13.5px/1.3 var(--ui);}
.note span:not(.tick){display:block;font:700 12px/1.35 var(--ui);color:#8a6f7c;margin-top:2px;}
.note .tick{width:24px;height:24px;border-radius:50%;border:2px solid #d9c3a8;display:grid;place-items:center;font:900 14px/1 var(--ui);color:#fff;}
.note.done{background:#eef7ef;border-color:#cfe6d3;}
.note.done .tick{background:var(--teal);border-color:var(--teal);}
.note.done b{color:#4a6b55;}
.nbar{height:8px;border-radius:4px;background:#efe1cf;overflow:hidden;}
.nbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#7fe0d6);}
.side{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 158px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.side.camp{top:calc(env(safe-area-inset-top,0px) + 12px);}
.side button{padding:9px 12px;font-size:12px;background:rgba(32,28,64,.85);box-shadow:none;}
.side button.hl{background:var(--sunset);}
[hidden]{display:none!important;}
.kw{display:inline-flex;align-items:center;gap:3px;font-family:var(--ui);font-weight:900;font-size:.82em;padding:1px 7px;border-radius:8px;vertical-align:.08em;white-space:nowrap;}
.kw svg{width:.95em;height:.95em;flex:none;}
.kw-p{background:#d9f1ee;color:#1f7d77;}.kw-m{background:#fbe1e7;color:#b8405e;}.kw-i{background:#fbefcf;color:#8a5a10;}.kw-n{background:#ece6f7;color:#5c4d8a;}.kw-s{background:#fde5d3;color:#a8501c;}
#callout .kw{display:inline;white-space:normal;padding:0 4px;font-size:1em;}
#callout .kw svg{display:inline;width:.85em;height:.85em;vertical-align:-1px;margin-right:2px;}
@media (min-width:700px){#callout{bottom:calc(env(safe-area-inset-bottom,0px) + 150px);font-size:14px;}}
.keycard{background:#2b2752;color:#fff6e9;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
.keycard b{font:900 10px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);}
.keycard span{font:800 13.5px/1.4 var(--ui);}
.badge{display:inline-block;font:900 9.5px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-radius:6px;background:var(--rose);color:#fff;vertical-align:middle;margin-left:6px;}
.badge.go{background:var(--teal);}
.badge{font-style:normal;}
.lb .stars{display:inline;color:#e8a01f;font-size:13px;}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px;border-radius:12px;background:var(--paper-2);border:2px solid var(--edge);}
.fi.ready{border-color:var(--gold);background:#fff6dc;}
.fi .top{font:800 14px/1.2 var(--ui);}
.fi .statrow{grid-column:1;display:flex;align-items:center;gap:8px;font:900 11px/1 var(--ui);color:#6d4f5c;}
.sbar{position:relative;flex:1;height:10px;border-radius:5px;background:#efe1cf;overflow:visible;}
.sbar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,#e8833a,#f2c14e);}
.sbar em{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:#3a2c44;}
.delta{font:900 12px/1 var(--ui);padding:3px 6px;border-radius:6px;}
.delta.up{background:#dff3e6;color:#2f8f5e;}.delta.down{background:#f3e6e6;color:#a05050;}.delta.same{background:#eee;color:#888;}
.fi .cost{grid-column:1;font:700 12px/1.4 var(--ui);color:#5b4a62;}
.fi button{grid-column:2;grid-row:1/4;padding:10px 14px;font-size:12.5px;}
.fi button.gold{background:var(--sunset);box-shadow:0 4px 0 #a8501c;}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;}
.gi{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;background:var(--paper-2);border:2px solid var(--edge);text-align:center;font:800 11.5px/1.2 var(--ui);color:var(--ink);cursor:pointer;box-shadow:none;}
.gi .sw{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:900 18px/1 var(--ui);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);}
.gi.locked{opacity:.75;}.gi.locked .sw{background:#cfc6cf!important;color:#8a7f8a;}
.gi.on{border-color:var(--teal);background:#eef7f6;}
.gi .badge{position:absolute;top:-6px;right:-4px;margin:0;}
.gi small{font:700 10.5px/1.25 var(--ui);color:#8a6f7c;}
.gcat{margin:6px 0 2px;font:900 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#a0573a;}
.lib{display:flex;flex-direction:column;gap:8px;}
.lb{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--paper-2);border:2px solid var(--edge);text-align:left;color:var(--ink);box-shadow:none;cursor:pointer;}
.lb .bk{width:30px;height:40px;border-radius:3px 6px 6px 3px;box-shadow:inset 4px 0 0 rgba(0,0,0,.18);}
.lb b{display:block;font:800 14px/1.2 var(--ui);}
.lb span{display:block;font:700 11.5px/1.3 var(--ui);color:#8a6f7c;}
.lb .time{font:900 10.5px/1 var(--ui);color:#5c4d8a;background:#ece6f7;padding:4px 7px;border-radius:6px;white-space:nowrap;}
.lb.locked{opacity:.6;cursor:default;}
.stars{color:#e8a01f;letter-spacing:1px;}
.rankup{background:#fff4d6;border:2px solid var(--gold);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;}
.rankup b{font:400 20px/1.1 var(--display);}
.rankup span{font:800 12.5px/1.4 var(--ui);color:#6d4f5c;}
.ftxt{position:fixed;transform:translate(-50%,-100%);font:900 15px/1 var(--ui);color:#fff6e9;background:rgba(32,28,64,.88);border:2px solid var(--gold);padding:5px 11px;border-radius:12px;pointer-events:none;z-index:6;white-space:nowrap;animation:ftUp 1.4s ease-out forwards;}

const BOUNTIES={
  mobs:{t:'Bonk 5 little monsters',goal:5,type:'x'}, view:{t:'Visit a {p:viewpoint}',goal:1,type:'x'}, herb:{t:'Gather 3 {i:Creek Herbs}',goal:3,type:'x'},
  ore:{t:'Mine 2 {i:Ledge Ore}',goal:2,type:'x'}, cherry:{t:'Pick wild {i:coffee cherries}',goal:1,type:'x'}, coffee:{t:'Order a drink at {p:Mocha’s café}',goal:1,type:'x'},
  hunt:{t:'Win a hunt',goal:1,type:'h'}, capture:{t:'Capture the {m:Tumblebrute}',goal:1,type:'h'}, norescue:{t:'Win without getting knocked out',goal:1,type:'h'},
  horns:{t:'Break its {i:horns}',goal:1,type:'h'}, crash:{t:'Make it {s:crash} into a rock',goal:1,type:'h'}};
const BOUNTY_PAY=10, BOUNTY_SET=15;
const dayKeyL=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function bountyToday(){ const dk=dayKeyL(); if(S.bounty&&S.bounty.day===dk) return S.bounty;
  let seed=0; for(const c of dk) seed=(seed*31+c.charCodeAt(0))>>>0; const rnd=()=>{ seed=(seed*1103515245+12345)>>>0; return seed/4294967296; };
  const xs=Object.keys(BOUNTIES).filter(k=>BOUNTIES[k].type==='x'), hs=Object.keys(BOUNTIES).filter(k=>BOUNTIES[k].type==='h');
  const pickOut=a=>a.splice(Math.floor(rnd()*a.length),1)[0];
  S.bounty={day:dk,ids:[pickOut(hs),pickOut(xs),pickOut(xs)],prog:{},done:{},seen:false}; save(); return S.bounty; }
function bump(id,n){ const b=bountyToday(); if(!b.ids.includes(id)||b.done[id]) return; b.prog[id]=Math.min(BOUNTIES[id].goal,(b.prog[id]||0)+(n||1));
  if(b.prog[id]>=BOUNTIES[id].goal){ b.done[id]=1; S.bountyTotal=(S.bountyTotal||0)+1; logFox({k:'bounty',id,day:b.day}); SND.fanfare(); const all=b.ids.every(i=>b.done[i]);
    if(all){ S.bountySets=(S.bountySets||0)+1; logFox({k:'bountySet',day:b.day}); } setTimeout(()=>callout(all?'All 3 bounties done! +'+(BOUNTY_PAY+BOUNTY_SET)+' Fox Coins today.':'Bounty done: '+BOUNTIES[id].t+' · +'+BOUNTY_PAY+' Fox Coins',4),300); }
  save(); }
const bountiesDone=()=>{ const b=bountyToday(); return b.ids.filter(i=>b.done[i]).length; };
function bountyHTML(){ const b=bountyToday(); const n=bountiesDone();
  return '<div class="bty"><div class="bty-h"><b>Today’s bounties · '+n+'/3</b><span>+'+BOUNTY_PAY+' each · +'+BOUNTY_SET+' bonus for all 3 · new ones at midnight</span></div>'+
    b.ids.map(i=>{ const B0=BOUNTIES[i], pr=b.prog[i]||0, d=!!b.done[i]; return '<div class="bty-r'+(d?' done':'')+'"><span class="tick">'+(d?'✓':'')+'</span><div><p>'+fmt(B0.t)+'</p><div class="bar"><i style="width:'+(pr/B0.goal*100)+'%"></i></div></div><em>'+pr+'/'+B0.goal+'</em></div>'; }).join('')+'</div>'; }

function updateWilds(dt,T){ if(!world.daily) return; if(world.anims) world.anims.forEach(f=>f(dt,T));
  const W=world, D=W.daily; if(D.kind==='whales') D.list.forEach(w=>{ w.a+=w.sp*dt; w.g.position.set(-4+Math.cos(w.a)*w.r,w.y+Math.sin(T*.5+w.r)*2,-50+Math.sin(w.a)*w.r); w.g.rotation.y=-w.a; });
  if(D.kind==='lanterns') D.list.forEach(l=>{ l.g.position.y+=l.sp*dt; if(l.g.position.y>40) l.g.position.y=1; l.g.position.x=l.x+Math.sin(T*.5+l.z)*.8; });
  if(D.kind==='stars'&&Math.random()<dt*2){ const x=-8+rand(-18,18), z=-72+rand(-18,18); puff(x,CH(x,z)+22,z,TEX.warm,.6,rand(-2,2),-24,rand(-2,2),.9,0); }
  if(D.kind==='flies'&&Math.random()<dt*10) puff(P.x+rand(-3,3),CH(P.x,P.z)+rand(.5,3),P.z+rand(-3,3),Math.random()<.5?TEX.teal:TEX.warm,.25,rand(-.5,.5),rand(.2,.8),rand(-.5,.5),1.4,0);
  if(W.scene.userData.isles) W.scene.userData.isles.forEach(i=>{ i.position.y=i.userData.y0+Math.sin(T*.8+i.userData.p)*.4; });
  W.glows.forEach(g=>{ g.material.opacity=.3+.35*Math.abs(Math.sin(T*1.3+g.userData.p)); });
  for(const it of inter){ if(it.done||!it.m) continue; if(it.m.userData.o) it.m.userData.o.rotation.y+=dt*2; if(it.kind==='wisp') it.m.position.y=it.y+Math.sin(T*2+it.id)*.25; if(it.kind==='dig'&&!it.m.visible&&wildPets.some(p=>Math.hypot(p.x-it.x,p.z-it.z)<9)){ it.m.visible=true; it.hidden=false; it.m.userData.glow.material.opacity=.8; const p=wildPets[0]; callout('Your {n:'+(p.id==='babyWyrm'?'Baby Dune Wyrm':'Baby Tumblebrute')+'} smells something! Look for the little dirt pile.',3.5); } }
  wildPets.forEach((p,i)=>{ const tx=P.x+Math.sin(P.ang+Math.PI+.8-i*1.6)*2.6, tz=P.z+Math.cos(P.ang+Math.PI+.8-i*1.6)*2.6; const dx=tx-p.x, dz=tz-p.z, d=Math.hypot(dx,dz); const mv=d>.6; if(mv){ const sp=Math.min(7,d*2.2); p.x+=dx/d*sp*dt; p.z+=dz/d*sp*dt; p.g.rotation.y=angLerp(p.g.rotation.y,Math.atan2(dx,dz),dt*6); } p.g.position.set(p.x,CH(p.x,p.z)+(mv?Math.abs(Math.sin(T*9+i))*.2:0),p.z);
    if(p.m.segs){ p.m.segs.forEach((s,k)=>{ const ph=T*(mv?7:2)-k*.75; s.g.position.x=Math.sin(ph)*.5*(mv?1:.3); }); p.m.shell.userData.sync(); } else p.m.rings.forEach(r=>{ r.rotation.y+=dt*r.userData.spd*(mv?3:.6); }); });
}
